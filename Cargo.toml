[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Simon Harris <simon@pearfalse.com>"]
rust-version = "1.84.0"

[workspace.dependencies]
ascii = "1.0"
arrayvec = "0.7"
thiserror = "1.0"
static_assertions = "1.1"
nonzero_ext = "0.3"

[package]
name = "basilisc"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
ascii = { workspace = true }
arrayvec = { workspace = true }
thiserror = { workspace = true }
static_assertions = { workspace = true }
nonzero_ext = { workspace = true }

basilisc-base = { path = "crates/basilisc-base" }

gumdrop = "0.8"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
assert_hex = "0.2"

[lints.clippy]
borrow_as_ptr = { level = "warn" }
cast_lossless = { level = "warn" }
copy_iterator = { level = "warn" }
doc_markdown = { level = "warn" }
elidable_lifetime_names = { level = "warn" }
enum_glob_use = { level = "warn" }
inline_always = { level = "warn" }
manual_let_else = { level = "warn" }
map_unwrap_or = { level = "warn" }
match_same_arms = { level = "warn" }
missing_errors_doc = { level = "warn" }
missing_fields_in_debug = { level = "warn" }
must_use_candidate = { level = "warn" }
ptr_as_ptr = { level = "warn" }
ref_as_ptr = { level = "warn" }
semicolon_if_nothing_returned = { level = "warn" }
separated_literal_suffix = { level = "warn" }
single_match_else = { level = "warn" }
uninlined_format_args = { level = "warn" }
unnecessary_trailing_comma = { level = "warn" }
unneeded_field_pattern = { level = "warn" }

ptr_cast_constness = { level = "deny" }
unnecessary_semicolon = { level = "deny" }
